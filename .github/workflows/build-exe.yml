name: Build Windows exe

# Builds an unsigned Bloom .exe (plus an NSIS installer) and uploads them as a
# downloadable artifact. Run it by hand from the Actions tab on any branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Updater artifacts need the project's private signing key, which forks
      # don't have, so they are switched off for this personal build.
      - name: Build app and installer
        shell: bash
        run: bun run tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: bloom-windows
          path: |
            src-tauri/target/release/bloom.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
