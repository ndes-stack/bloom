name: Build Windows exe

# Builds an unsigned Qapsule .exe (plus an NSIS installer) and uploads them as a
# downloadable artifact. Run it by hand from the Actions tab on any branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tauri downloads its NSIS toolset from GitHub releases when packaging, and
      # that download has been failing with 504s. Put the toolset where Tauri
      # looks first (%LOCALAPPDATA%\tauri\NSIS), so packaging needs no download:
      # Tauri's own zip if it comes through, otherwise a normal NSIS install.
      - name: Prepare NSIS
        shell: pwsh
        run: |
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          $nsis = Join-Path $tools "NSIS"
          New-Item -ItemType Directory -Force $tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "nsis.zip"
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o $zip "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive $zip -DestinationPath $tools -Force
            Move-Item (Join-Path $tools "nsis-3.11") $nsis
          } else {
            Write-Host "Tauri's NSIS zip is unavailable; using a regular NSIS install"
            $installed = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$installed\makensis.exe")) { choco install nsis -y --no-progress }
            Copy-Item $installed $nsis -Recurse
          }
          $plugin = Join-Path $nsis "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force $plugin | Out-Null
          curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 -o (Join-Path $plugin "nsis_tauri_utils.dll") "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
          if ($LASTEXITCODE -ne 0) { throw "Could not download nsis_tauri_utils.dll" }
          $hash = (Get-FileHash (Join-Path $plugin "nsis_tauri_utils.dll") -Algorithm SHA1).Hash
          if ($hash -ne "75197FEE3C6A814FE035788D1C34EAD39349B860") { throw "nsis_tauri_utils.dll hash mismatch: $hash" }
          foreach ($f in "makensis.exe","Bin\makensis.exe","Stubs\lzma-x86-unicode","Include\MUI2.nsh","Include\Win\RestartManager.nsh") {
            if (-not (Test-Path (Join-Path $nsis $f))) { throw "NSIS is missing $f" }
          }

      # Updater artifacts need the project's private signing key, which forks
      # don't have, so they are switched off for this personal build.
      - name: Build app and installer
        shell: bash
        # Packaging downloads NSIS from GitHub, which sometimes times out (504):
        # try up to three times. The compiled app is reused, so retries are quick.
        run: |
          for attempt in 1 2 3; do
            bun run tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}' && exit 0
            echo "Build attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: qapsule-windows
          # Only the installer: the bare exe, opened from the zip, ran
          # from a temporary folder and stopped starting at login.
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
